name: Update Tool Versions

# Pin changes land as pull requests, never as pushes. Dispatch re-pins only the
# tool named in the payload; the daily run re-pins only tools whose new main
# commit has all-green check runs. The operator merges the PR.

on:
  repository_dispatch:
    types: [tool-updated]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tool_name:
        description: 'Specific tool to re-pin (leave empty for the daily all-green rule)'
        required: false
        type: string

concurrency:
  group: registry-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      INPUT_TOOL: ${{ github.event.inputs.tool_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Unit tests and validation (before any write step)
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py

      - name: Re-pin gated tools
        run: |
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/payload.json"
          args=(--verbose --pr-body "$RUNNER_TEMP/pr-body.md" --changed "$RUNNER_TEMP/changed.txt")
          if [ -n "$INPUT_TOOL" ]; then
            args+=(--tool "$INPUT_TOOL")
          else
            args+=(--payload-file "$RUNNER_TEMP/payload.json")
          fi
          python scripts/update-versions.py "${args[@]}"

      - name: Validate the new registry and check each new pin builds
        run: |
          python scripts/validate.py
          while read -r name; do
            [ -n "$name" ] || continue
            read -r repo sha < <(python - "$name" <<'PY'
          import sys, yaml
          for a in yaml.safe_load(open("registry/apps.yaml"))["apps"]["official"]:
              if a["name"] == sys.argv[1]:
                  print(a["repo"].split("/", 1)[1], a["version"])
          PY
            )
            dir="$RUNNER_TEMP/pin-$name"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "https://github.com/$repo.git" "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
            if ! LC_ALL=C make -C "$dir" -n build >/dev/null 2>&1; then
              echo "::error::make -n build failed for $name at $sha"
              exit 1
            fi
            echo "ok: $name $sha"
          done < "$RUNNER_TEMP/changed.txt"

      - name: Open pull request
        # peter-evans/create-pull-request v8.1.1
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ github.token }}
          add-paths: registry/apps.yaml
          commit-message: "chore: update tool pins"
          title: "Update tool pins"
          body-path: ${{ runner.temp }}/pr-body.md
          branch: automated/version-updates
          delete-branch: true
          labels: |
            automated
            version-update
